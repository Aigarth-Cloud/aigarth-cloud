# Aigarth Cloud — local development stack.
#
# Brings up everything the apps and services need to run end-to-end locally,
# without any cloud accounts. Use:
#
#   pnpm stack:up      # start
#   pnpm stack:down    # stop
#   pnpm stack:logs    # follow logs
#   pnpm stack:ps      # show running containers
#
# Ports:
#   postgres   5432   (identity, core, billing, ...)
#   redis      6379  (sessions, rate limits, job queues)
#   nats       4222  (event bus, Qubic event ingestion)
#   minio      9000  (S3-compatible object storage; console at 9001)
#   mailhog    1025  (SMTP for dev; web UI at 8025)
#
# Data is persisted in the .pgdata, .redisdata, .natsdata, .miniodata volumes.

name: aigarth-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: aigarth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aigarth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aigarth_dev}
      POSTGRES_DB: ${POSTGRES_DB:-aigarth}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - .pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aigarth} -d ${POSTGRES_DB:-aigarth}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aigarth-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - .redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    container_name: aigarth-nats
    restart: unless-stopped
    command: ["nats-server", "-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "${NATS_PORT:-4222}:4222"   # client
      - "8222:8222"                 # monitoring
    volumes:
      - .natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: aigarth-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aigarth}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aigarth_dev_secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "9001:9001"
    volumes:
      - .miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: aigarth-mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_WEB_PORT:-8025}:8025"

  # One-shot: create the `aigarth` bucket in MinIO.
  minio-init:
    image: minio/mc:latest
    container_name: aigarth-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-aigarth} ${MINIO_ROOT_PASSWORD:-aigarth_dev_secret} &&
      mc mb -p local/aigarth || true &&
      mc anonymous set download local/aigarth || true &&
      echo 'MinIO bucket ready: aigarth'
      "
    restart: "no"

  # ----------------------------------------------------------------------
  # AIO Qubic Dev Kit — Phase 20.1.
  #
  # This is the local Qubic testnet we use to deploy + exercise the
  # AigarthPool QPI contract (Phase 20.2). It is heavy: ~24 GB RAM,
  # Linux x86-64 only, and the AIO image ships Core + Faucet + Wallet
  # + RPC. It is NOT part of the default `pnpm stack:up`; opt in with:
  #
  #   pnpm stack:up --profile qubic-devnet
  #
  # Without this profile, services/aigarthpool/src/simulator.ts is the
  # default backend for every AigarthPool client. The simulator is a
  # pure-TypeScript state machine that mirrors the on-chain spec, so
  # the rest of the system (services/ann, services/training,
  # services/qubic watcher) is fully exercisable on a laptop.
  #
  # See docs/aigarthpool/README.md for the deploy + audit checklist.
  # ----------------------------------------------------------------------
  aio-qubic-devnet:
    image: ghcr.io/qubic/core-aio:latest
    container_name: aigarth-aio-devnet
    profiles: ["qubic-devnet"]  # opt-in only
    restart: unless-stopped
    ports:
      - "${AIO_RPC_PORT:-30303}:30303"        # Core P2P
      - "${AIO_RPC_HTTP_PORT:-30000}:30000"  # Core JSON-RPC (procedures + queries)
      - "${AIO_WALLET_PORT}:${AIO_WALLET_PORT:-8080}:8080"  # AIO Wallet
    environment:
      AIO_FAUCET_ENABLED: "true"
      AIO_LOG_LEVEL: "info"
    # AVX2 + ~24 GB RAM requirement. Set `--memory=24g` (or more) when
    # running on hosts that can spare it. On Windows / macOS without
    # AVX2, AIO will not start — fall back to the simulator.
    deploy:
      resources:
        limits:
          memory: 26G
        reservations:
          memory: 20G
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:30000/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s  # AIO is slow to bootstrap (C++ Core)

volumes:
  .pgdata:
  .redisdata:
  .natsdata:
  .miniodata:
  .aiodata:
